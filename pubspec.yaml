name: connect_native_http
description: >-
  connect-dart HttpClients over HTTP/3 with full-duplex streams, swift-nio-http3 on iOS and Cronet on Android, plus
  HTTP/3 datagram sessions on iOS.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  connectrpc: ^2.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.agtonomy.connect_native_http
        pluginClass: ConnectNativeHttpPlugin
      ios:
        pluginClass: ConnectNativeHttpPlugin

# Run from test_server/ with ./generate.sh. Generates the Go server stubs here and the Dart client the example app's
# integration tests use.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: connectnativehttp/testserver/gen
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-dart
    out: ../example/lib/gen
  - local: protoc-gen-connect-dart
    out: ../example/lib/gen
